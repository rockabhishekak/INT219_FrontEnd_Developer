<!-- Activity 2: create a comment Section write comment and add it to the page -->
 <!-- then show like reply edit and delete options post button -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comment Section</title>
    <link rel="stylesheet" href="activity.css">
</head>
<body>
    <main class="page-shell">
        <section id="comment-section" class="comment-card">
            <div class="section-heading">
                <h1>Comment Section</h1>
            </div>

            <div class="comment-form">
                <textarea id="comment-input" placeholder="Write a comment..."></textarea>
                <button id="post-comment" type="button">Post Comment</button>
            </div>

            <div id="comments-container" class="comments-container"></div>
        </section>
    </main>

    <script src="activity.js"></script>
</body>
</html>
